# App version. Bump this on main and the Release workflow builds installers and publishes v<version> automatically.
# SemVer: MAJOR for breaking changes, MINOR for new features, PATCH for fixes.
# This file is also the release trigger: any change here re-runs the Release workflow.
appVersion=1.5.16
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
