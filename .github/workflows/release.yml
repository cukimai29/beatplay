name: Release

# Automatic production release: bump appVersion in gradle.properties and push to main.
# If tag v<appVersion> doesn't exist yet, this builds deb/rpm/msi with that version and publishes
# a GitHub release (creating the tag), which the in-app update check picks up.
on:
  push:
    branches: [main]
    paths:
      - gradle.properties
      # Allows re-running a failed release after fixing this workflow.
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '[:space:]')
          # MSI and deb need a plain MAJOR.MINOR.PATCH version.
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::appVersion must look like 1.2.3, got '$v'"; exit 1; }
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            task: packageReleaseDeb packageReleaseRpm
          - os: windows-latest
            task: packageReleaseMsi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Without libVLC, vlcj recursively scans the runner's directories during audio tests,
      # which on Windows does not fail: it hangs until the step timeout.
      - name: Install VLC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y vlc-bin vlc-plugin-base libvlc5
      - name: Install VLC and WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | ForEach-Object { "$($_.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          $vlcInstalled = $false
          for ($i = 1; $i -le 3; $i++) {
            choco install vlc --yes --no-progress
            if ($LASTEXITCODE -eq 0) { $vlcInstalled = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $vlcInstalled) {
            $installer = "$env:TEMP\vlc-installer.exe"
            Invoke-WebRequest -Uri "https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.exe" -OutFile $installer
            Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          }
      - name: Locate VLC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vlc = "C:\Program Files\VideoLAN\VLC"
          if (-not (Test-Path "$vlc\libvlc.dll")) { throw "VLC was installed but libvlc.dll is missing from $vlc" }
          "VLC_PATH=$vlc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test
        timeout-minutes: 15
        shell: bash
        run: |
          set +e
          bash ./gradlew :shared:jvmTest :app:test --no-daemon
          code=$?
          for f in shared/build/test-results/test/*.xml app/build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            awk '/<testcase /{if (match($0, /name="[^"]+"/)) n=substr($0, RSTART+6, RLENGTH-7)} /<(failure|error)[ >]/{print n}' "$f" | sort -u | while read -r t; do
              echo "::error::Test failed ($(uname -s)): $t in $(basename "$f" .xml)"
            done
          done
          exit $code
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ runner.os }}
          path: |
            shared/build/test-results/test/*.xml
            app/build/test-results/test/*.xml
          if-no-files-found: ignore
      - name: Package
        shell: bash
        run: for t in ${{ matrix.task }}; do bash ./gradlew ":app:$t" --no-daemon; done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            app/build/compose/binaries/main-release/deb/*.deb
            app/build/compose/binaries/main-release/rpm/*.rpm
            app/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate AI Changelog & Release Notes
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          if ! python3 scripts/changelog.py --release "$TAG" --output release-notes.md; then
            echo "AI changelog failed; falling back to the raw commit list."
            { echo "## What's Changed"; git log -n 20 --pretty='- %s (%h)'; } > release-notes.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs(changelog): update CHANGELOG.md for $TAG [skip ci]"
          # Push bot bisa kalah race dengan push manusia; rebase dulu agar fast-forward.
          git pull --rebase origin main || (git rebase --abort; exit 1)
          git push origin HEAD:main
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BeatPlay ${{ needs.version.outputs.tag }}
          files: dist/**/*
          body_path: release-notes.md
          make_latest: true
